# Minimal single-binary Tempo, local disk storage -- no object storage
# backend needed at this scale (SPEC.md §30's ask is "traces span API ->
# worker -> LLM", not long-term trace retention at volume).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

compactor:
  compaction:
    block_retention: 48h
