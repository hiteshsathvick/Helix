name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - run: ruff check backend
      - run: ruff format --check backend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - run: mypy backend/app
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: helix
          POSTGRES_PASSWORD: helix
          POSTGRES_DB: helix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helix"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # helix is a superuser (Postgres bootstrap requirement) and must never
      # be the runtime role: superusers bypass Row-Level Security. Migrations
      # run as helix; the app (and pytest, since it imports app.core.db) runs
      # as helix_app, created below the same way
      # infra/docker/postgres-init/01-app-role.sql does for local dev.
      DATABASE_URL: postgresql+asyncpg://helix_app:helix_app@localhost:5432/helix
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://helix:helix@localhost:5432/helix
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "backend[dev]"
      - run: psql -h localhost -U helix -d helix -f infra/docker/postgres-init/01-app-role.sql
        env:
          PGPASSWORD: helix
      - run: alembic upgrade head
        working-directory: backend
      - run: alembic downgrade base
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest
        working-directory: backend

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f infra/docker/backend.Dockerfile -t helix-backend:ci .
      - run: docker build -f infra/docker/frontend.Dockerfile -t helix-frontend:ci .
