name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --extra-index-url resolves torch to its CPU-only build (see
      # infra/docker/backend.Dockerfile) instead of the ~2.6GB CUDA default.
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e "backend[dev]"
      - run: ruff check backend
      - run: ruff format --check backend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e "backend[dev]"
      - run: mypy backend/app
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: helix
          POSTGRES_PASSWORD: helix
          POSTGRES_DB: helix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helix"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        # bitnami's image (not minio/minio) specifically because GitHub
        # Actions service containers can't override the container command —
        # minio/minio's default CMD needs `server /data` args to actually
        # start, which isn't possible here; bitnami's entrypoint runs a real
        # server from env vars alone.
        image: bitnami/minio:latest
        ports:
          - 9000:9000
        env:
          MINIO_ROOT_USER: helix
          MINIO_ROOT_PASSWORD: helix-secret
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # helix is a superuser (Postgres bootstrap requirement) and must never
      # be the runtime role: superusers bypass Row-Level Security. Migrations
      # run as helix; the app (and pytest, since it imports app.core.db) runs
      # as helix_app, created below the same way
      # infra/docker/postgres-init/01-app-role.sql does for local dev.
      DATABASE_URL: postgresql+asyncpg://helix_app:helix_app@localhost:5432/helix
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://helix:helix@localhost:5432/helix
      REDIS_URL: redis://localhost:6379/0
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: helix
      S3_SECRET_KEY: helix-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e "backend[dev]"
      - run: psql -h localhost -U helix -d helix -f infra/docker/postgres-init/01-app-role.sql
        env:
          PGPASSWORD: helix
      - run: alembic upgrade head
        working-directory: backend
      - run: alembic downgrade base
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: pytest
        working-directory: backend

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f infra/docker/backend.Dockerfile -t helix-backend:ci .
      - run: docker build -f infra/docker/frontend.Dockerfile -t helix-frontend:ci .

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
