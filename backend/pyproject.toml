[project]
name = "helix-backend"
version = "0.1.0"
description = "Helix backend: FastAPI modular monolith"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<0.30",
    "argon2-cffi>=23.1,<24",
    "pyjwt>=2.9,<3",
    "redis>=5.0,<6",
    "email-validator>=2.2,<3",
    "boto3>=1.34,<2",
    "python-multipart>=0.0.9,<0.1",
    "arq>=0.26,<0.27",
    "pgvector>=0.3,<0.4",
    "sentence-transformers>=3.0,<4",
    "pypdf>=4.3,<5",
    "beautifulsoup4>=4.12,<5",
    "tiktoken>=0.7,<0.8",
    "anthropic>=0.40,<1",
    "openai>=1.50,<2",
    # Used directly by the agents module's http_request tool (SPEC.md §19),
    # not just transitively via anthropic/openai's own HTTP clients.
    "httpx>=0.27,<0.28",
    # Authenticated symmetric encryption (Fernet) for connector OAuth tokens
    # at rest (SPEC.md §26) — core/security.py only has one-way hashing,
    # and a token must be decrypted to make API calls with it.
    "cryptography>=43,<44",
    # Checkout Sessions, Subscriptions, and webhook signature verification
    # (SPEC.md §16) -- the official SDK is the boring, correct choice over
    # hand-rolling Stripe's HMAC-timestamp webhook scheme.
    "stripe>=10,<11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6",
    "ruff>=0.6,<0.7",
    "mypy>=1.11,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "app.modules.orgs.dependencies.require_permission",
    "app.modules.api.dependencies.require_api_key",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app"]

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/versions/*", "app/tests/*", "*/tests/*"]

[tool.coverage.report]
# SPEC.md §32: coverage focus on critical paths, not a vanity percentage --
# this is visibility, not a gate, so no fail_under here.
skip_empty = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
